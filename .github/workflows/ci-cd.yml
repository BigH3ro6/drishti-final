name: GCP CI/CD Deploy Backend Flask Service

on:
  push:
    branches: [ main ]
    
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}
  DEPLOY_DIR: /home/drishti/backend
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create serviceAccount.json
        run: |
          # Use the double-nested path you verified earlier
          mkdir -p backend/backend/flask_service
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > backend/backend/flask_service/serviceAccount.json

      - name: Create .env file for Docker
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=/app/serviceAccount.json" > backend/backend/flask_service/.env
          echo "PYTHONUNBUFFERED=1" >> backend/backend/flask_service/.env

      - name: Start services for testing
        run: |
          cd backend/backend/flask_service
          docker-compose up -d
          sleep 15  # Increased slightly for safety

      - name: Wait for Flask service to be ready
        run: |
          timeout 60 bash -c 'until curl -sSf http://localhost:5000/; do echo "Waiting for Flask..."; sleep 5; done'

      - name: Check Flask Logs on Failure
        if: failure()
        run: |
          cd backend/backend/flask_service
          docker-compose logs backend
          
      - name: Run health check
        run: curl -f http://localhost:5000 || exit 1

      - name: Stop services
        run: |
          cd backend/backend/flask_service
          docker-compose down

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCE Instance
        run: |
          gcloud compute ssh ${{ env.GCE_INSTANCE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --command="
              # --- 1. PREPARE DEPLOYMENT DIRECTORY ---
              sudo mkdir -p ${{ env.DEPLOY_DIR }}
              sudo chown -R \$USER:\$USER ${{ env.DEPLOY_DIR }}
              cd ${{ env.DEPLOY_DIR }}

              # --- 2. CLONE OR UPDATE REPOSITORY ---
              if [ ! -d .git ]; then
                git clone https://x-access-token:${{ env.GH_TOKEN }}@github.com/${{ github.repository }}.git .
              else
                git fetch origin main
                git reset --hard origin/main
              fi

              # --- 3. NAVIGATE TO NESTED DIRECTORY ---
              cd backend/backend/flask_service

              # --- 4. INJECT CREDENTIALS SECURELY ---
              # Using 'EOF' prevents shell expansion/syntax errors with JSON
              cat << 'EOF' > serviceAccount.json
              ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
              EOF

              cat << 'EOF' > .env
              GOOGLE_APPLICATION_CREDENTIALS=/app/serviceAccount.json
              PYTHONUNBUFFERED=1
              FLASK_ENV=production
              EOF

              # --- 5. BUILD AND RUN ---
              export DOCKER_BUILDKIT=1
              sudo docker-compose pull
              sudo docker-compose up -d --build --remove-orphans

              # --- 6. CLEANUP & VERIFY ---
              sudo docker image prune -f
              sleep 5
              sudo docker-compose ps
            "
