name: GCP CI/CD Deploy Backend Flask Service

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCE_INSTANCE_NAME: ${{ secrets.GCE_INSTANCE_NAME }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}
  DEPLOY_DIR: /home/drishti/backend
  GH_TOKEN: ${{ secrets.GH_TOKEN }} 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create serviceAccount.json
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > backend/flask_service/serviceAccount.json

      - name: Create .env file for Docker
        run: |
          cat > backend/flask_service/.env << 'EOF'
          GOOGLE_APPLICATION_CREDENTIALS=/app/serviceAccount.json
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          OPENWEATHERMAP_API_KEY=${{ secrets.OPENWEATHERMAP_API_KEY }}
          CURRENCY_API_URL=${{ secrets.CURRENCY_API_URL }}
          OBSTACLE_PREDICT_IMAGE_URL=${{ secrets.OBSTACLE_PREDICT_IMAGE_URL }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EOF

      - name: Build and Test Services
        run: |
          cd backend/flask_service
          docker compose up -d --build
          sleep 10
          # Health check
          curl -f http://localhost:5000 || (docker compose logs && exit 1)
          docker compose down

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare Config Files for VM
        run: |
          # Generate the .env specifically for the VM deployment
          cat > /tmp/deploy.env << 'EOF'
          GOOGLE_APPLICATION_CREDENTIALS=/app/serviceAccount.json
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          OPENWEATHERMAP_API_KEY=${{ secrets.OPENWEATHERMAP_API_KEY }}
          CURRENCY_API_URL=${{ secrets.CURRENCY_API_URL }}
          OBSTACLE_PREDICT_IMAGE_URL=${{ secrets.OBSTACLE_PREDICT_IMAGE_URL }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EOF
          
          # Create the Service Account JSON from secrets
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > /tmp/serviceAccount.json

      - name: Copy Configs to VM
        run: |
          # Uploading both files to /tmp on the VM first
          gcloud compute scp /tmp/deploy.env /tmp/serviceAccount.json ${{ env.GCE_INSTANCE_NAME }}:/tmp/ \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --quiet

      - name: Execute Remote Deployment
        run: |
          gcloud compute ssh ${{ env.GCE_INSTANCE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --zone=${{ env.GCE_ZONE }} \
            --tunnel-through-iap \
            --quiet \
            --command="
              sudo mkdir -p ${{ env.DEPLOY_DIR }}
              sudo chown -R \$USER:\$USER ${{ env.DEPLOY_DIR }}
              cd ${{ env.DEPLOY_DIR }}

              if [ ! -d .git ]; then
                echo '📦 First deployment: Cloning repository...'
                git clone \"https://x-access-token:${{ env.GH_TOKEN }}@github.com/${{ github.repository }}.git\" .
              else
                echo '🔄 Updating repository...'
                git remote set-url origin \"https://x-access-token:${{ env.GH_TOKEN }}@github.com/${{ github.repository }}.git\"
                git fetch origin main
                git reset --hard origin/main
              fi

              # Move files from /tmp to the service directory
              cd ${{ env.DEPLOY_DIR }}/backend/flask_service
              mv /tmp/deploy.env ./.env
              mv /tmp/serviceAccount.json ./serviceAccount.json

              export DOCKER_BUILDKIT=1
              sudo docker compose up -d --build --remove-orphans
              sudo docker image prune -f
              
              echo '✅ Deployment successful!'
            "
